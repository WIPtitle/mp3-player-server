openapi: 3.0.0
info:
  title: Audio Server REST API
  description: Network audio playback service with file storage and volume control
  version: 1.5.0

servers:
  - url: http://{{host}}:{{port}}
    description: Audio Server
    variables:
      host:
        default: localhost
        description: Server hostname or IP address
      port:
        default: '8888'
        description: Server port

tags:
  - name: Audio Files
    description: Audio file management
  - name: Playback
    description: Audio playback control with volume
  - name: Status
    description: Server status
  - name: Devices
    description: Audio device management

paths:
  /api/status:
    get:
      tags:
        - Status
      summary: Get server status
      description: Returns current playback status, volume, and available files
      operationId: getStatus
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  playing:
                    type: boolean
                    description: Whether audio is currently playing
                  current:
                    type: string
                    nullable: true
                    description: Name of currently playing file
                  current_volume:
                    type: integer
                    description: Current playback volume (0-100)
                    minimum: 0
                    maximum: 100
                  files:
                    type: array
                    items:
                      type: string
                    description: List of available audio files
                  audio_device:
                    type: string
                    nullable: true
                    description: Current audio device ID
                example:
                  playing: true
                  current: "alarm"
                  current_volume: 75
                  files: ["alarm", "waiting"]
                  audio_device: "plughw:0,0"

  /api/audio:
    get:
      tags:
        - Audio Files
      summary: List audio files
      description: Returns list of all stored audio files
      operationId: listAudioFiles
      responses:
        '200':
          description: List of audio files
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: string
                    description: List of audio file names (without .mp3 extension)
                example:
                  files: ["alarm", "waiting"]

  /api/audio/{name}:
    get:
      tags:
        - Audio Files
      summary: Check if audio file exists
      description: Checks if an audio file with the given name exists
      operationId: checkAudioFile
      parameters:
        - name: name
          in: path
          required: true
          description: Audio file name (with or without .mp3 extension)
          schema:
            type: string
          example: alarm
      responses:
        '200':
          description: File exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                    example: true
                  name:
                    type: string
                    example: alarm
        '404':
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Audio file 'alarm' not found"

    put:
      tags:
        - Audio Files
      summary: Save audio file
      description: |
        Saves an audio file with the given name. If a file with the same name exists, 
        it will be overwritten. Maximum file size is 50MB.
      operationId: saveAudioFile
      parameters:
        - name: name
          in: path
          required: true
          description: Audio file name (with or without .mp3 extension)
          schema:
            type: string
          example: alarm
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: File saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Audio file 'alarm' saved"
        '413':
          description: File too large
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "File too large (max 50MB)"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

    delete:
      tags:
        - Audio Files
      summary: Delete audio file
      description: |
        Deletes an audio file. If the file is currently playing, 
        playback will be stopped first.
      operationId: deleteAudioFile
      parameters:
        - name: name
          in: path
          required: true
          description: Audio file name (with or without .mp3 extension)
          schema:
            type: string
          example: alarm
      responses:
        '200':
          description: File deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Audio file 'alarm' deleted"
        '404':
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Audio file 'alarm' not found"

  /api/play/{name}:
    post:
      tags:
        - Playback
      summary: Play audio file with volume control
      description: |
        Starts playing the specified audio file with the given volume. 
        Volume is a required parameter (0-100). If another file is playing, 
        it will be stopped first.
      operationId: playAudioFile
      parameters:
        - name: name
          in: path
          required: true
          description: Audio file name (with or without .mp3 extension)
          schema:
            type: string
          example: alarm
        - name: volume
          in: query
          required: true
          description: Playback volume (0-100, where 0 is mute and 100 is maximum)
          schema:
            type: integer
            minimum: 0
            maximum: 100
          example: 75
        - name: loop
          in: query
          required: false
          description: Whether to loop the audio file
          schema:
            type: boolean
            default: false
          example: true
      responses:
        '200':
          description: Playback started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Playing 'alarm' at 75% volume (loop)"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                examples:
                  missing_volume:
                    value:
                      error: "Missing required parameter: volume (0-100)"
                  invalid_volume:
                    value:
                      error: "Volume must be between 0 and 100"
                  no_device:
                    value:
                      error: "No audio device configured. Please select an audio device first."
        '404':
          description: File not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Audio file 'alarm' not found"
        '500':
          description: Playback failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to start playback. Check audio device configuration."

  /api/stop:
    post:
      tags:
        - Playback
      summary: Stop playback
      description: Stops current audio playback
      operationId: stopPlayback
      responses:
        '200':
          description: Playback stopped or no audio playing
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples:
                      - "Playback stopped"
                      - "No audio playing"

  /api/devices:
    get:
      tags:
        - Devices
      summary: List audio devices
      description: Returns list of available audio output devices
      operationId: listDevices
      responses:
        '200':
          description: List of audio devices
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Device identifier (e.g., plughw:0,0)
                        name:
                          type: string
                          description: Human-readable device name
                        card:
                          type: integer
                          description: Card number
                        device:
                          type: integer
                          description: Device number
                        card_id:
                          type: string
                          description: Card ID
                        card_name:
                          type: string
                          description: Card name
                        device_name:
                          type: string
                          description: Device name
                  current:
                    type: string
                    nullable: true
                    description: Currently selected device ID
                example:
                  devices:
                    - id: "plughw:0,0"
                      name: "HDA Intel PCH - ALC295 Analog"
                      card: 0
                      device: 0
                      card_id: "PCH"
                      card_name: "HDA Intel PCH"
                      device_name: "ALC295 Analog"
                  current: "plughw:0,0"

  /api/device:
    get:
      tags:
        - Devices
      summary: Get current audio device
      description: Returns the currently selected audio device
      operationId: getCurrentDevice
      responses:
        '200':
          description: Current device
          content:
            application/json:
              schema:
                type: object
                properties:
                  device:
                    type: string
                    nullable: true
                    description: Device ID or null if not configured
                example:
                  device: "plughw:0,0"

    put:
      tags:
        - Devices
      summary: Set audio device
      description: Sets the audio output device
      operationId: setDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device:
                  type: string
                  description: Device ID to set
              required:
                - device
            example:
              device: "plughw:0,0"
      responses:
        '200':
          description: Device set successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Audio device set to 'plughw:0,0'"
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "No device specified"
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string